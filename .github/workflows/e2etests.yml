name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Report results to Testbench
        if: always()
        working-directory: e2e
        env:
          TESTBENCH_URL: ${{ secrets.TESTBENCH_URL }}
          TESTBENCH_PROJECT_ID: ${{ vars.TESTBENCH_PROJECT_ID }}
          TESTBENCH_API_TOKEN: ${{ secrets.TESTBENCH_API_TOKEN }}
        run: node ci-report.mjs results.json

      - name: Upload results for TestBench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-results
          path: |
            e2e/results.json
            e2e/test-results/
          retention-days: 7
