name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Report results to Testbench
        if: always()
        env:
          TESTBENCH_URL: ${{ secrets.TESTBENCH_URL }}
          TESTBENCH_PROJECT_ID: ${{ vars.TESTBENCH_PROJECT_ID }}
          TESTBENCH_API_TOKEN: ${{ secrets.TESTBENCH_API_TOKEN }}
        run: node ci-report.mjs results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          
      - name: Upload results for TestBench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-results
          path: |
            results.json
            test-results/
          retention-days: 7
